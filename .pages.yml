# Pages CMS (https://app.pagescms.org): write and edit blog posts.
# Saving commits to GitHub; the GitHub Action rebuilds the site and Cloudflare publishes it.

settings:
  content:
    merge: true   # keep values the editor doesn't show (imported WordPress details)

media:
  - name: blog_images
    label: Blog images
    input: blog/images
    output: /blog/images
    categories: [image]
    rename: safe

content:
  - name: blog
    label: Blog posts
    type: collection
    path: content/blog
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title, date, author]
      primary: title
      sort: [date, title]
      search: [title, slug]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL slug
        description: Lowercase words joined by hyphens, e.g. ielts-speaking-tips. The post is at casperacademy.in/blog/<slug>/. Don't change it on a published post, or old links break.
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and hyphens only
      - name: date
        label: Publish date
        description: Newest posts show first on the blog.
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
      - name: author
        label: Author
        description: Shown as "By <name>" on the post. Leave empty to hide.
        type: string
      - name: categories
        label: Categories
        description: The first one is shown in the breadcrumb and decides the "Keep reading" posts.
        type: select
        required: true
        options:
          multiple: true
          values:
            - name: ielts-preparation
              label: IELTS Preparation
            - name: about-casper
              label: About Casper
            - name: pte-academic
              label: PTE Academic
            - name: english-skills
              label: English Skills
            - name: study-abroad
              label: Study Abroad & Visas
            - name: toefl
              label: TOEFL
      - name: image
        label: Cover image
        description: Shown on the blog list (cropped to 16:10) and at the top of the post (16:9). Landscape photos work best.
        type: image
        required: true
        options:
          media: blog_images
      - name: content
        label: Post
        type: rich-text
        required: true
        options:
          format: html
          media: blog_images
      - name: excerpt
        label: Summary (optional)
        description: Short text under the title on the blog list. Leave empty to use the first 26 words of the post.
        type: text
      - name: seo
        label: Google (optional)
        type: object
        fields:
          - name: title
            label: Title in Google
            description: Leave empty to use the post title.
            type: string
          - name: description
            label: Description in Google
            description: One or two sentences. Leave empty to use the summary.
            type: text
      - name: tags
        label: Tags (optional)
        description: Lowercase words joined by hyphens, e.g. ielts-coaching-in-kochi.
        type: string
        list: true
