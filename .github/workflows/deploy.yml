# Builds the site (php tools/build.php) and publishes dist/ to the cloudflare-pages branch.
# Cloudflare Pages deploys that branch as-is (no build command), so every push to main,
# including posts saved in Pages CMS, is live about a minute later.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd
      - run: php tools/build.php
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cloudflare-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Build from ${{ github.sha }}'
